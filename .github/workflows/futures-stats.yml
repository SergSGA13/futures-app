# Автообновление вкладки Futures Strategy: гоняет backtest_v29 по расписанию
# и пишет результаты в Google Sheets (FUT_STRAT / _SL / _SLT + _PF).
#
# Требуется секрет GOOGLE_CREDS_JSON (содержимое google-creds.json целиком):
#   Settings -> Secrets and variables -> Actions -> New repository secret.
# Без секрета запуск завершается без ошибки с предупреждением - расписание
# можно включать до того, как добавлен ключ.
name: Update Futures Strategy stats

on:
  schedule:
    - cron: '23 */6 * * *'   # каждые 6 часов; минута 23 - чтобы не толкаться в пике нагрузки GitHub
  workflow_dispatch:
    inputs:
      preset:
        description: 'Пресет (base / sl / sltrend / all)'
        default: 'all'
        type: choice
        options: [all, base, sl, sltrend]
      probe_only:
        description: 'Только проверить доступность API, без бэктеста'
        type: boolean
        default: false

concurrency:
  group: futures-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Probe APIs (Binance / Bybit / Google)
        run: |
          probe() { printf '%-24s %s\n' "$1:" "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$2" || echo FAIL)"; }
          probe fapi.binance.com   https://fapi.binance.com/fapi/v1/ping
          probe api.bybit.com      https://api.bybit.com/v5/market/time
          probe data.binance.vision https://data.binance.vision/
          probe oauth2.googleapis.com https://oauth2.googleapis.com/

      - name: Check credentials secret
        if: ${{ !inputs.probe_only }}
        id: creds
        env:
          CREDS: ${{ secrets.GOOGLE_CREDS_JSON }}
        run: |
          if [ -z "$CREDS" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Секрет GOOGLE_CREDS_JSON не задан - обновление Sheets пропущено. Добавьте его: Settings -> Secrets and variables -> Actions."
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
            printf '%s' "$CREDS" > "$RUNNER_TEMP/google-creds.json"
          fi

      - name: Set up Python
        if: ${{ !inputs.probe_only && steps.creds.outputs.have == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        if: ${{ !inputs.probe_only && steps.creds.outputs.have == 'true' }}
        run: pip install -r scripts/requirements.txt

      - name: Run backtest and update Google Sheets
        if: ${{ !inputs.probe_only && steps.creds.outputs.have == 'true' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/google-creds.json
        run: python scripts/update_sheets.py --preset "${{ inputs.preset || 'all' }}"
